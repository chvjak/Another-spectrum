name: Final framebuffer performance
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/final-perf.yml
      - vm-port/final-perf-trigger.txt
      - vm-port/final-perf-source.part-*
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
          path: opt
      - name: Restore final performance sources
        run: cat opt/vm-port/final-perf-source.part-* | base64 -d | tar -xz -C opt
      - name: Install video encoder required by the exact EGA setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run deterministic restore and full-fill matrix
        run: bash opt/vm-port/run_final_perf_ci.sh
      - name: Upload final performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-framebuffer-performance
          path: result/
