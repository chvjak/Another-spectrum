name: Inspect combined benchmark helper
on:
  push:
    branches: [st-span-optimizations]
    paths: [.github/workflows/inspect-combined-helper.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
      - shell: bash
        run: |
          git show 86eb222f5a313e80fac2996f6edd11e697fcf563:vm-port/ci-minimal-full-ab.py.gz.b64 > /tmp/helper.b64
          python3 - <<'PY'
          import base64,gzip,pathlib,re
          s=pathlib.Path('/tmp/helper.b64').read_text()
          b=''.join(re.findall(r'[A-Za-z0-9+/=]',s))
          t=gzip.decompress(base64.b64decode(b)).decode()
          lines=t.splitlines()
          for i,line in enumerate(lines):
              if any(k in line for k in ('event_runs','AW_KEEP_ALL_DRAWS','9648','draw-event','EVENT_RUNS')):
                  print(f'--- around {i+1} ---')
                  for j in range(max(0,i-8),min(len(lines),i+16)):
                      print(f'{j+1:04d}: {lines[j]}')
          PY