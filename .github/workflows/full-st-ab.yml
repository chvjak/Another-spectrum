name: Full ST renderer A/B

on:
  push:
    branches: [st-span-optimizations]
    paths: [.github/workflows/full-st-ab.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
          path: opt

      - name: Checkout recovered VM source
        uses: actions/checkout@v4
        with:
          ref: 3c16c71f3a172eb9c22164e42e22f34a67179e17
          path: source

      - name: Restore and fix full A/B harness
        shell: bash
        run: |
          mkdir -p bench
          cd opt
          git show 86eb222f5a313e80fac2996f6edd11e697fcf563:vm-port/ci-minimal-full-ab.py.gz.b64 > ../bench/minimal.b64
          git show 86eb222f5a313e80fac2996f6edd11e697fcf563:vm-port/ci-run-minimal-ab.mjs.gz.b64 > ../bench/runner.b64
          git show 86eb222f5a313e80fac2996f6edd11e697fcf563:vm-port/ci-st-renderer-patch.py.gz.b64 > ../bench/patch.b64
          cd ..
          python3 - <<'PY'
          import base64, gzip, pathlib, re
          for src, dst in [
              ('bench/minimal.b64','bench/minimal_full_ab.py'),
              ('bench/runner.b64','bench/run_minimal_ab.mjs'),
              ('bench/patch.b64','bench/st_renderer_patch.py')]:
              s=pathlib.Path(src).read_text()
              b=''.join(re.findall(r'[A-Za-z0-9+/=]',s))
              pathlib.Path(dst).write_bytes(gzip.decompress(base64.b64decode(b)))

          p=pathlib.Path('bench/minimal_full_ab.py')
          s=p.read_text()
          marker='\nif __name__ == "__main__":'
          if marker not in s:
              raise SystemExit('helper main marker missing')
          decoder=r'''
def extract_js_resources(path):
    """Extract and ByteKiller-decompress intro palette, bytecode and shapes."""
    text = path.read_text(encoding="utf-8")

    def be32(buf, offset):
        return int.from_bytes(buf[offset:offset + 4], "big")

    def unpack_bytekiller(src, expected):
        src_offset = len(src) - 4
        remaining = be32(src, src_offset)
        src_offset -= 4
        if remaining != expected:
            raise RuntimeError(f"ByteKiller size {remaining}, expected {expected}")
        dst = bytearray(remaining)
        dst_offset = remaining - 1
        crc = be32(src, src_offset)
        src_offset -= 4
        bits = be32(src, src_offset)
        src_offset -= 4
        crc ^= bits

        def next_bit():
            nonlocal bits, crc, src_offset
            carry = bits & 1
            bits >>= 1
            if bits == 0:
                if src_offset < 0:
                    raise RuntimeError("ByteKiller source underrun")
                bits = be32(src, src_offset)
                src_offset -= 4
                crc ^= bits
                carry = bits & 1
                bits = 0x80000000 | (bits >> 1)
            return carry

        def get_bits(count):
            value = 0
            for _ in range(count):
                value = (value << 1) | next_bit()
            return value

        def copy_literal(bits_count, extra):
            nonlocal remaining, dst_offset
            count = get_bits(bits_count) + extra + 1
            remaining -= count
            if remaining < 0:
                count += remaining
                remaining = 0
            for i in range(count):
                dst[dst_offset - i] = get_bits(8)
            dst_offset -= count

        def copy_reference(bits_count, count):
            nonlocal remaining, dst_offset
            remaining -= count
            if remaining < 0:
                count += remaining
                remaining = 0
            offset = get_bits(bits_count)
            for i in range(count):
                dst[dst_offset - i] = dst[dst_offset - i + offset]
            dst_offset -= count

        while remaining > 0:
            if not next_bit():
                if not next_bit():
                    copy_literal(3, 0)
                else:
                    copy_reference(8, 2)
            else:
                code = get_bits(2)
                if code == 3:
                    copy_literal(8, 8)
                elif code == 2:
                    copy_reference(12, get_bits(8) + 1)
                elif code == 1:
                    copy_reference(10, 4)
                else:
                    copy_reference(9, 3)
        if crc != 0:
            raise RuntimeError(f"ByteKiller CRC {crc:#x}")
        return bytes(dst)

    resources = {}
    for number in (RESOURCE_PALETTE, RESOURCE_BYTECODE, RESOURCE_SHAPES):
        hex_id = f"{number:02x}"
        data_match = re.search(rf'const data{hex_id} = "([A-Za-z0-9+/=]+)";', text)
        size_match = re.search(rf'const size{hex_id} = (\d+);', text)
        if data_match is None or size_match is None:
            raise RuntimeError(f"resource {number:#x} missing from {path}")
        payload = base64.b64decode(data_match.group(1), validate=True)
        expected = int(size_match.group(1))
        if len(payload) != expected:
            payload = unpack_bytekiller(payload, expected)
        if len(payload) != expected:
            raise RuntimeError(f"resource {number:#x}: {len(payload)} != {expected}")
        resources[number] = payload
    return resources[RESOURCE_BYTECODE], resources[RESOURCE_SHAPES], resources[RESOURCE_PALETTE]
'''
          p.write_text(s.replace(marker, decoder + marker, 1))

          # Normalize one recovered local label that sjasmplus otherwise parses
          # as an instruction because of a leading blank.
          for asm in pathlib.Path('source/vm-port').glob('*.asm'):
              text=asm.read_text()
              text=re.sub(r'(?m)^\s+(\.[A-Za-z_][A-Za-z0-9_]*:)\s*$', r'\1', text)
              asm.write_text(text)
          PY

      - name: Checkout embedded DOS demo resources
        uses: actions/checkout@v4
        with:
          repository: cyxx/another_js
          ref: gh-pages
          path: game-data
          sparse-checkout: ootwdemo.js
          sparse-checkout-cone-mode: false

      - name: Build sjasmplus
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/z00m128/sjasmplus.git
          make -C sjasmplus -j2

      - name: Build JSSpeccy core
        shell: bash
        run: |
          git clone https://github.com/gasman/jsspeccy3.git
          cd jsspeccy3
          git checkout cf886f39c2a72752a0bd49568fef398b141c11f2
          npm ci
          npm run build:core
          npm run build:wasm:release

      - name: Build and run complete baseline/ST snapshots
        shell: bash
        run: |
          python3 bench/minimal_full_ab.py \
            --source-dir source/vm-port \
            --patch-dir bench \
            --resource-js game-data/ootwdemo.js \
            --sjasmplus "$PWD/sjasmplus/sjasmplus" \
            --out "$PWD/out"
          node bench/run_minimal_ab.mjs \
            "$PWD/jsspeccy3/dist/jsspeccy/jsspeccy-core.wasm" \
            "$PWD/out"
          cat out/minimal-manifest.json
          cat out/minimal-ab-result.json

      - name: Commit measured result to benchmark branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          cp out/minimal-manifest.json opt/vm-port/full-st-ab-manifest.json
          cp out/minimal-ab-result.json opt/vm-port/full-st-ab-result.json
          cd opt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vm-port/full-st-ab-manifest.json vm-port/full-st-ab-result.json
          git commit -m "Record measured full ST renderer A/B" || exit 0
          git push origin HEAD:st-span-optimizations

      - name: Upload measured result
        uses: actions/upload-artifact@v4
        with:
          name: full-st-ab-result
          path: out/
