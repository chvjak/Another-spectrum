name: Viewport and coordinate-table benchmark
on:
  push:
    branches: [st-span-optimizations]
    paths:
      - .github/workflows/full-st-ab.yml
      - vm-port/generate_optimizer_trace.mjs
      - vm-port/st_renderer_patch.py
      - vm-port/viewport_renderer_patch.py
      - vm-port/patch_ab_resources.py
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
          path: opt

      - name: Checkout embedded DOS intro and JS engine
        uses: actions/checkout@v4
        with:
          repository: cyxx/another_js
          ref: gh-pages
          path: game-data
          sparse-checkout: |
            ootwdemo.js
            another.min.js
          sparse-checkout-cone-mode: false

      - name: Install trace dependencies
        run: python3 -m pip install --user numpy pillow

      - name: Generate exact ownership mask and event runs
        shell: bash
        run: |
          mkdir -p opt/vm-port/build-full bench variants result
          node opt/vm-port/generate_optimizer_trace.mjs \
            game-data/ootwdemo.js game-data/another.min.js \
            opt/vm-port/build-full/optimizer-trace.log
          python3 opt/vm-port/optimize_draws.py
          python3 - <<'PY'
          from pathlib import Path
          packed=Path('opt/vm-port/build-full/draw-event-keep-mask.bin').read_bytes()
          count=9648
          bits=[(packed[i>>3]>>(i&7))&1 for i in range(count)]
          out=bytearray([bits[0]])
          current=bits[0]
          run=0
          for bit in bits:
              if bit==current and run<255:
                  run+=1
                  continue
              out.append(run)
              if bit==current:
                  out.append(0)
              current=bit
              run=1
          out.append(run)
          Path('bench/event-runs.bin').write_bytes(out)
          print({'events':count,'kept':sum(bits),'event_runs_bytes':len(out)})
          PY

      - name: Restore and patch complete A/B harness
        shell: bash
        run: |
          git -C opt show 86eb222f5a313e80fac2996f6edd11e697fcf563:vm-port/ci-minimal-full-ab.py.gz.b64 > bench/minimal.b64
          git -C opt show 86eb222f5a313e80fac2996f6edd11e697fcf563:vm-port/ci-run-minimal-ab.mjs.gz.b64 > bench/runner.b64
          python3 - <<'PY'
          import base64,gzip,pathlib,re,shutil
          for src,dst in [('bench/minimal.b64','bench/minimal_full_ab.py'),('bench/runner.b64','bench/run_minimal_ab.mjs')]:
              text=pathlib.Path(src).read_text()
              encoded=''.join(re.findall(r'[A-Za-z0-9+/=]',text))
              pathlib.Path(dst).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          shutil.copy2('opt/vm-port/st_renderer_patch.py','bench/st_renderer_patch_base.py')
          shutil.copy2('opt/vm-port/st_renderer_patch.py','bench/st_renderer_patch.py')
          PY
          python3 opt/vm-port/patch_ab_resources.py bench/minimal_full_ab.py
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('bench/minimal_full_ab.py')
          s=p.read_text()
          old='event_runs = all_keep_runs()'
          new='event_runs = Path("bench/event-runs.bin").read_bytes()'
          if old not in s:
              raise SystemExit('event-run builder changed')
          s=s.replace(old,new,1)
          s=s.replace('real DOS bytecode/shapes, all draw events, neutral visual assets','real DOS bytecode/shapes, optimized draw ownership, neutral visual assets',1)
          p.write_text(s)

          r=pathlib.Path('bench/run_minimal_ab.mjs')
          t=r.read_text()
          if '100000' not in t:
              raise SystemExit('runner ceiling changed')
          r.write_text(t.replace('100000','300000',1))

          for asm in pathlib.Path('opt/vm-port').glob('*.asm'):
              text=asm.read_text()
              text=re.sub(r'(?m)^\s+(\.[A-Za-z_][A-Za-z0-9_]*:)\s*$',r'\1',text)
              asm.write_text(text)
          PY

      - name: Build sjasmplus
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/z00m128/sjasmplus.git
          make -C sjasmplus -j2

      - name: Build JSSpeccy core
        shell: bash
        run: |
          git clone https://github.com/gasman/jsspeccy3.git
          cd jsspeccy3
          git checkout cf886f39c2a72752a0bd49568fef398b141c11f2
          npm ci
          npm run build:core
          npm run build:wasm:release

      - name: Build current combined ST reference
        shell: bash
        run: |
          python3 bench/minimal_full_ab.py \
            --source-dir opt/vm-port \
            --patch-dir bench \
            --resource-js game-data/ootwdemo.js \
            --sjasmplus "$PWD/sjasmplus/sjasmplus" \
            --out "$PWD/out-current"
          cp out-current/st.sna variants/current-st.sna
          cp out-current/minimal-manifest.json result/current-st-manifest.json

      - name: Enable fixed-bank lookup tables
        shell: bash
        run: |
          cp opt/vm-port/viewport_renderer_patch.py bench/st_renderer_patch.py
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('bench/minimal_full_ab.py')
          s=p.read_text()
          pattern=r'(?m)^(\s*)pages = \[bytearray\(0x4000\) for _ in range\(8\)\]\s*$'
          match=re.search(pattern,s)
          if match is None:
              raise SystemExit('snapshot page allocation changed')
          indent=match.group(1)
          replacement=(match.group(0)+'\n'+indent+'from st_renderer_patch import viewport_tables, TABLE_BANK2_OFFSET'+'\n'+indent+'put(pages[2], TABLE_BANK2_OFFSET, viewport_tables(), "coordinate tables")')
          s=s[:match.start()]+replacement+s[match.end():]
          p.write_text(s)
          PY
          for viewport in 256x192 224x176 224x160; do
            AW_VIEWPORT="$viewport" PYTHONPATH=bench python3 - <<'PY'
          import os
          from st_renderer_patch import viewport_tables, selected_viewport
          width,height=selected_viewport()
          table=viewport_tables()
          assert len(table)==520
          print({'viewport':os.environ['AW_VIEWPORT'],'width':width,'height':height,'table_bytes':len(table)})
          PY
          done

      - name: Build lookup, viewport and collapsed-polygon variants
        shell: bash
        run: |
          for viewport in 256x192 224x176 224x160; do
            out="out-${viewport}"
            AW_VIEWPORT="$viewport" python3 bench/minimal_full_ab.py \
              --source-dir opt/vm-port \
              --patch-dir bench \
              --resource-js game-data/ootwdemo.js \
              --sjasmplus "$PWD/sjasmplus/sjasmplus" \
              --out "$PWD/$out"
            cp "$out/st.sna" "variants/${viewport}.sna"
            cp "$out/minimal-manifest.json" "result/${viewport}-manifest.json"

            fast_out="out-${viewport}-fast"
            AW_VIEWPORT="$viewport" AW_FAST_DEGENERATE=1 python3 bench/minimal_full_ab.py \
              --source-dir opt/vm-port \
              --patch-dir bench \
              --resource-js game-data/ootwdemo.js \
              --sjasmplus "$PWD/sjasmplus/sjasmplus" \
              --out "$PWD/$fast_out"
            cp "$fast_out/st.sna" "variants/${viewport}-fast.sna"
            cp "$fast_out/minimal-manifest.json" "result/${viewport}-fast-manifest.json"
          done

      - name: Run complete comparisons
        shell: bash
        run: |
          wasm="$PWD/jsspeccy3/dist/jsspeccy/jsspeccy-core.wasm"
          for variant in 256x192 224x176 224x160 256x192-fast 224x176-fast 224x160-fast; do
            dir="$PWD/compare-${variant}"
            mkdir -p "$dir"
            cp variants/current-st.sna "$dir/baseline.sna"
            cp "variants/${variant}.sna" "$dir/st.sna"
            node bench/run_minimal_ab.mjs "$wasm" "$dir"
            cp "$dir/minimal-ab-result.json" "result/${variant}-result.json"
            echo "===== ${variant} ====="
            cat "result/${variant}-result.json"
          done
          cp opt/vm-port/build-full/draw-optimization.json result/
          cp bench/event-runs.bin result/
          cp variants/*.sna result/

      - name: Upload measured viewport results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-st-results
          path: result/
