name: Original-colour intro preview
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/geometry-preview.yml
      - vm-port/capture_original_colour_preview.mjs
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          path: opt
      - uses: actions/checkout@v4
        with:
          repository: cyxx/another_js
          ref: gh-pages
          path: game-data
          sparse-checkout: |
            ootwdemo.js
            another.min.js
          sparse-checkout-cone-mode: false
      - name: Install video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate capture script
        run: node --check opt/vm-port/capture_original_colour_preview.mjs
      - name: Encode 164.52-second original-colour preview
        shell: bash
        run: |
          mkdir -p result
          node opt/vm-port/capture_original_colour_preview.mjs \
            game-data/ootwdemo.js game-data/another.min.js | \
          ffmpeg -y -hide_banner -loglevel warning \
            -f rawvideo -pixel_format rgb24 -video_size 320x200 -framerate 7450/4113 -i - \
            -vf "scale=960:600:flags=neighbor,pad=960:720:0:60:black,fps=25" \
            -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p \
            result/another-world-original-colours-164.52s.mp4
          ffmpeg -y -hide_banner -loglevel warning \
            -i result/another-world-original-colours-164.52s.mp4 \
            -vf "fps=12/164.52,scale=320:240:flags=neighbor,tile=4x3" \
            -frames:v 1 result/original-colours-contact-sheet.png
      - name: Upload original-colour preview
        uses: actions/upload-artifact@v4
        with:
          name: original-colour-preview
          path: result/
