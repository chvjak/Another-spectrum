name: Viewable geometry preview
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/geometry-preview.yml
      - vm-port/render_geometry_preview.py
      - vm-port/generate_optimizer_trace.mjs
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          path: opt
      - uses: actions/checkout@v4
        with:
          repository: cyxx/another_js
          ref: gh-pages
          path: game-data
          sparse-checkout: |
            ootwdemo.js
            another.min.js
          sparse-checkout-cone-mode: false
      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user pillow
      - name: Generate semantic geometry trace
        run: |
          mkdir -p frames result
          node opt/vm-port/generate_optimizer_trace.mjs \
            game-data/ootwdemo.js game-data/another.min.js optimizer-trace.log
      - name: Render sampled presentation frames
        run: |
          python3 opt/vm-port/render_geometry_preview.py optimizer-trace.log frames
      - name: Encode 164.52-second viewable preview
        run: |
          ffmpeg -y -hide_banner -loglevel warning \
            -framerate 7450/4113 -i frames/frame-%03d.png \
            -vf "scale=960:600:flags=neighbor,pad=960:720:0:60:black,fps=25" \
            -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p \
            result/another-world-spectrum-geometry-preview-164.52s.mp4
          ffmpeg -y -hide_banner -loglevel warning \
            -i result/another-world-spectrum-geometry-preview-164.52s.mp4 \
            -vf "fps=12/164.52,scale=320:240:flags=neighbor,tile=4x3" \
            -frames:v 1 result/geometry-preview-contact-sheet.png
          cp optimizer-trace.log result/
      - name: Upload viewable geometry preview
        uses: actions/upload-artifact@v4
        with:
          name: geometry-preview
          path: result/
