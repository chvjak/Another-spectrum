name: Specialized unrolled copy and fill benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/unrolled-perf.yml
      - vm-port/unrolled-perf-trigger.txt
      - vm-port/unrolled_perf_patch.py
      - vm-port/unrolled_perf_build.py
      - vm-port/run_unrolled_perf_ci.sh
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unrolled-copy-fill-tests
          fetch-depth: 0
          path: opt
      - name: Restore final performance sources
        run: cat opt/vm-port/final-perf-source.part-* | base64 -d | tar -xz -C opt
      - name: Install video encoder required by the baseline pipeline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run full specialized copy and fill matrix
        run: bash opt/vm-port/run_unrolled_perf_ci.sh
      - name: Upload measured variants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unrolled-copy-fill-results
          path: result/
