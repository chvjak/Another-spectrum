name: AY real-time benchmark and demo
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ay-rt45.yml
      - vm-port/ay_rt45_build.py
      - vm-port/ay_rt45_runner.mjs
      - vm-port/ay_rt45_audio.py
      - vm-port/run_ay_rt45_ci.sh
      - vm-port/ay-rt45-trigger.txt
permissions:
  contents: read
jobs:
  benchmark-record:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-4p5fps-ay
          fetch-depth: 0
          path: opt
      - uses: actions/checkout@v4
        with:
          ref: diff-stream-music
          fetch-depth: 0
          path: music-src
      - name: Install audio and video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user numpy scipy pillow
      - name: Build and measure resident AY version
        run: bash opt/vm-port/run_ay_rt45_ci.sh
      - name: Fetch original shareware web engine
        run: git clone --depth 1 --branch gh-pages https://github.com/cyxx/another_js.git another_js
      - name: Capture correctly framed source presentations
        run: |
          mkdir -p render-out
          node opt/vm-port/capture_original_colour_preview.mjs \
            another_js/ootwdemo.js another_js/another.min.js \
            > render-out/original-298-320x200.rgb
          test "$(stat -c %s render-out/original-298-320x200.rgb)" = "57216000"
      - name: Render synchronized Spectrum video
        shell: bash
        run: |
          set -euo pipefail
          python3 opt/vm-port/render_rt45_demo.py \
            render-out/original-298-320x200.rgb \
            opt/vm-port/cost-4p5-render.json \
            --mode spectrum \
            --contact-sheet render-out/another-world-zx-spectrum-cost-4p5-ay-contact-sheet.png | \
          ffmpeg -y -hide_banner -loglevel warning \
            -f rawvideo -pixel_format rgb24 -video_size 320x240 -framerate 25 -i - \
            -an -vf scale=960:720:flags=neighbor \
            -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p -movflags +faststart \
            render-out/another-world-zx-spectrum-cost-4p5-ay-silent.mp4
      - name: Mux exact resident AY schedule
        run: |
          ffmpeg -y -hide_banner -loglevel warning \
            -i render-out/another-world-zx-spectrum-cost-4p5-ay-silent.mp4 \
            -i out/ay-rt45/another-world-ay-v5-resident-25hz-164.52s.wav \
            -c:v copy -c:a aac -b:a 192k -t 164.52 -movflags +faststart \
            render-out/another-world-zx-spectrum-cost-4p5-ay-164.52s.mp4
      - name: Verify recording
        run: |
          ffprobe -v error -count_frames \
            -show_entries stream=index,codec_type,codec_name,width,height,avg_frame_rate,nb_read_frames,sample_rate \
            -show_entries format=duration,size \
            -of json render-out/another-world-zx-spectrum-cost-4p5-ay-164.52s.mp4 \
            > render-out/ay-video-metadata.json
          cat render-out/ay-video-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('render-out/ay-video-metadata.json').read_text())
          video=next(s for s in d['streams'] if s['codec_type']=='video')
          audio=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert video['width']==960 and video['height']==720, d
          assert video['avg_frame_rate']=='25/1', d
          assert int(video['nb_read_frames'])==4113, d
          assert audio['codec_name']=='aac' and audio['sample_rate']=='44100', d
          assert abs(float(d['format']['duration'])-164.52)<0.03, d
          result=json.loads(Path('out/ay-rt45/ay-performance-result.json').read_text())
          assert result['passed'] and result['ay']['ay_updates']==4113, result
          PY
          rm -f render-out/original-298-320x200.rgb render-out/another-world-zx-spectrum-cost-4p5-ay-silent.mp4
          cp -f render-out/* result/ay-rt45/
      - name: Upload measured AY build and demo
        uses: actions/upload-artifact@v4
        with:
          name: another-world-rt45-ay
          path: result/ay-rt45/
          retention-days: 90
