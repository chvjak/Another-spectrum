name: Final framebuffer performance
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ega-pr.yml
      - vm-port/final-perf-trigger.txt
      - vm-port/final-perf-source.part-*
      - vm-port/final-perf-fix2.part-*
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
          path: opt
      - name: Restore final performance sources
        run: |
          cat opt/vm-port/final-perf-source.part-* | base64 -d | tar -xz -C opt
          cat opt/vm-port/final-perf-fix2.part-* | base64 -d | tar -xz -C opt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('opt/vm-port/final_perf_patch.py')
          s = p.read_text()
          s = s.replace('        jr z,.done_call', '        jp z,.done_call')
          s = s.replace('        jr .done_call', '        jp .done_call')
          p.write_text(s)
          PY
      - name: Install video encoder required by exact EGA setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run final framebuffer matrix
        run: bash opt/vm-port/run_final_perf_ci.sh
      - name: Upload final framebuffer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-framebuffer-performance
          path: result/
