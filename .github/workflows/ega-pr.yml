name: EGA framebuffer profile PR
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ega-pr.yml
      - vm-port/ega-run-trigger.txt
      - vm-port/ega-source.part-*
      - vm-port/ega-profile-relocate.patch
      - vm-port/run_ega_ci.sh
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
          path: opt
      - name: Install video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run EGA matrix, profile and capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('opt/vm-port/run_ega_ci.sh')
          s=p.read_text()
          marker='cat "$OPT"/vm-port/ega-source.part-* | base64 -d | tar -xz -C "$OPT"\n'
          if marker not in s:
              raise SystemExit('runner extraction marker changed')
          s=s.replace(marker, marker + 'git -C "$OPT" apply vm-port/ega-profile-relocate.patch\n', 1)
          p.write_text(s)
          PY
          bash opt/vm-port/run_ega_ci.sh
      - name: Upload EGA profile and viewable intro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ega-framebuffer-results
          path: result/
