name: Viewport and colour-copy benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ega-pr.yml
      - vm-port/viewport_color_build.py
      - vm-port/run_viewport_color_matrix.mjs
      - vm-port/run_viewport_color_ci.sh
      - vm-port/ega-source.part-*
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
          path: opt
      - name: Run viewport and colour-copy matrix
        run: bash opt/vm-port/run_viewport_color_ci.sh
      - name: Upload viewport results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-colour-results
          path: result-vp/
