name: Benchmark ST renderer

on:
  push:
    branches: [st-span-optimizations]
    paths:
      - .github/workflows/benchmark-st.yml
      - vm-port/ci-minimal-full-ab.py.gz.b64
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          path: opt

      - name: Checkout recovered VM source
        uses: actions/checkout@v4
        with:
          ref: 3c16c71f3a172eb9c22164e42e22f34a67179e17
          path: source

      - name: Restore benchmark scripts
        shell: bash
        run: |
          mkdir -p bench
          python3 - <<'PY'
          import base64, gzip, pathlib, re
          files = (
              ('opt/vm-port/ci-minimal-full-ab.py.gz.b64', 'bench/minimal_full_ab.py'),
              ('opt/vm-port/ci-run-minimal-ab.mjs.gz.b64', 'bench/run_minimal_ab.mjs'),
              ('opt/vm-port/ci-st-renderer-patch.py.gz.b64', 'bench/st_renderer_patch.py'),
          )
          for source, destination in files:
              text = pathlib.Path(source).read_text()
              encoded = ''.join(re.findall(r'[A-Za-z0-9+/=]', text))
              encoded += '=' * ((4 - len(encoded) % 4) % 4)
              pathlib.Path(destination).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          chmod +x bench/minimal_full_ab.py

      - name: Checkout embedded DOS demo resources
        uses: actions/checkout@v4
        with:
          repository: cyxx/another_js
          ref: gh-pages
          path: game-data
          sparse-checkout: ootwdemo.js
          sparse-checkout-cone-mode: false

      - name: Build sjasmplus
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/z00m128/sjasmplus.git
          make -C sjasmplus -j2

      - name: Build JSSpeccy core
        shell: bash
        run: |
          git clone https://github.com/gasman/jsspeccy3.git
          cd jsspeccy3
          git checkout cf886f39c2a72752a0bd49568fef398b141c11f2
          npm ci
          npm run build:core
          npm run build:wasm:release

      - name: Build and run baseline/ST snapshots
        shell: bash
        run: |
          python3 bench/minimal_full_ab.py \
            --source-dir source/vm-port \
            --patch-dir bench \
            --resource-js game-data/ootwdemo.js \
            --sjasmplus "$PWD/sjasmplus/sjasmplus" \
            --out "$PWD/out"
          node bench/run_minimal_ab.mjs \
            "$PWD/jsspeccy3/dist/jsspeccy/jsspeccy-core.wasm" \
            "$PWD/out"
          cat out/minimal-manifest.json
          cat out/minimal-ab-result.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: st-renderer-ab-result
          path: |
            out/minimal-manifest.json
            out/minimal-ab-result.json
            out/renderer-baseline.bin
            out/renderer-st.bin
