name: Row-oriented full-fill benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/row-fill.yml
      - vm-port/row-fill-trigger.txt
      - vm-port/run_row_fill_ci.sh
      - vm-port/final-perf-source.part-*
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: row-oriented-full-fill
          fetch-depth: 0
          path: opt
      - name: Restore final performance sources
        run: cat opt/vm-port/final-perf-source.part-* | base64 -d | tar -xz -C opt
      - name: Install video encoder required by the exact EGA setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run row-oriented full-fill matrix
        run: bash opt/vm-port/run_row_fill_ci.sh
      - name: Upload measured row-fill variants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row-oriented-full-fill-results
          path: result/
