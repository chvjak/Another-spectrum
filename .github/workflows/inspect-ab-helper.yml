name: Inspect A/B helper
on:
  push:
    branches: [st-span-optimizations]
    paths: [.github/workflows/inspect-ab-helper.yml]
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: cyxx/another_js
          ref: gh-pages
          path: game-data
          sparse-checkout: ootwdemo.js
          sparse-checkout-cone-mode: false
      - shell: bash
        run: |
          python3 - <<'PY'
          import base64,pathlib,re,zlib
          text=pathlib.Path('game-data/ootwdemo.js').read_text()
          m=re.search(r'const data17 = "([A-Za-z0-9+/=]+)";',text)
          s=re.search(r'const size17 = (\d+);',text)
          payload=base64.b64decode(m.group(1),validate=True)
          print('compressed',len(payload),'expected',s.group(1),'head',payload[:32].hex())
          for w in (-15,15,31,0,47):
              try:
                  out=zlib.decompress(payload,w)
                  print('wbits',w,'ok',len(out),out[:16].hex())
              except Exception as e:
                  print('wbits',w,'fail',repr(e))
          PY
