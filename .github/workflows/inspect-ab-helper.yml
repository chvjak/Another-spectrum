name: Inspect A/B helper
on:
  push:
    branches: [st-span-optimizations]
    paths: [.github/workflows/inspect-ab-helper.yml]
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: st-span-optimizations
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: cyxx/another_js
          ref: gh-pages
          path: game-data
          sparse-checkout: ootwdemo.js
          sparse-checkout-cone-mode: false
      - shell: bash
        run: |
          npm init -y >/dev/null
          npm install pako@1.0.11 >/dev/null
          node - <<'JS'
          const fs=require('fs');
          const pako=require('pako');
          const text=fs.readFileSync('game-data/ootwdemo.js','utf8');
          const data=text.match(/const data17 = "([A-Za-z0-9+/=]+)";/)[1];
          const expected=+text.match(/const size17 = (\d+);/)[1];
          const bytes=Buffer.from(data,'base64');
          console.log('compressed',bytes.length,'expected',expected,'head',bytes.subarray(0,32).toString('hex'));
          for (const input of [bytes, bytes.toString('binary')]) {
            try {
              const out=pako.inflate(input);
              console.log('pako ok',typeof input,input.constructor?.name,out.length,Buffer.from(out).subarray(0,16).toString('hex'));
            } catch(e) {
              console.log('pako fail',typeof input,input.constructor?.name,String(e));
            }
          }
          JS
