name: Inspect AY source
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-ay-source.yml
      - vm-port/ay-inspect-trigger.txt
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-4p5fps-ay
          path: opt
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: diff-stream-music
          path: music-src
          fetch-depth: 0
      - name: Inventory AY branch
        run: |
          mkdir -p result
          find music-src -type f -printf '%p %s\n' | sort > result/tree.txt
          grep -RIlE 'AY|ay_|music|50 ?Hz|interrupt|0xFFFD|65533|0xBFFD|49149' music-src | sort > result/relevant-files.txt || true
          echo '--- relevant files ---'
          cat result/relevant-files.txt
          echo '--- music tree ---'
          grep -E 'music|ay|player|audio|sound|wav|vgm|bin|asm|sna' result/tree.txt | head -400 || true
          tar -czf result/relevant-source.tgz -T result/relevant-files.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: ay-source-inventory
          path: result/
