name: Render 4.5 fps real-time demo
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/render-rt45-demo.yml
      - vm-port/render_rt45_demo.py
      - vm-port/cost-4p5-render.json
      - vm-port/render-rt45-trigger.txt
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rt-4p5fps
          fetch-depth: 0
          path: opt
      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user numpy pillow
      - name: Fetch original shareware web engine
        run: git clone --depth 1 --branch gh-pages https://github.com/cyxx/another_js.git another_js
      - name: Capture 298 correctly framed original-colour samples
        run: |
          mkdir -p render-out
          node opt/vm-port/capture_original_colour_preview.mjs \
            another_js/ootwdemo.js another_js/another.min.js \
            > render-out/original-298-320x200.rgb
          test "$(stat -c %s render-out/original-298-320x200.rgb)" = "57216000"
      - name: Render Spectrum attribute-constrained demo
        shell: bash
        run: |
          set -euo pipefail
          python3 opt/vm-port/render_rt45_demo.py \
            render-out/original-298-320x200.rgb \
            opt/vm-port/cost-4p5-render.json \
            --mode spectrum \
            --contact-sheet render-out/another-world-zx-spectrum-cost-4p5-contact-sheet.png | \
          ffmpeg -y -hide_banner -loglevel warning \
            -f rawvideo -pixel_format rgb24 -video_size 320x240 -framerate 25 -i - \
            -an -vf scale=960:720:flags=neighbor \
            -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p \
            -movflags +faststart \
            render-out/another-world-zx-spectrum-cost-4p5-164.52s.mp4
      - name: Render corrected original-colour reference
        shell: bash
        run: |
          set -euo pipefail
          python3 opt/vm-port/render_rt45_demo.py \
            render-out/original-298-320x200.rgb \
            opt/vm-port/cost-4p5-render.json \
            --mode source \
            --contact-sheet render-out/another-world-original-colour-contact-sheet.png | \
          ffmpeg -y -hide_banner -loglevel warning \
            -f rawvideo -pixel_format rgb24 -video_size 320x240 -framerate 25 -i - \
            -an -vf scale=960:720:flags=neighbor \
            -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p \
            -movflags +faststart \
            render-out/another-world-original-colour-cost-4p5-164.52s.mp4
      - name: Verify encoded videos
        run: |
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=width,height,avg_frame_rate,nb_read_frames \
            -show_entries format=duration,size \
            -of json render-out/another-world-zx-spectrum-cost-4p5-164.52s.mp4 \
            > render-out/spectrum-video-metadata.json
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=width,height,avg_frame_rate,nb_read_frames \
            -show_entries format=duration,size \
            -of json render-out/another-world-original-colour-cost-4p5-164.52s.mp4 \
            > render-out/original-colour-video-metadata.json
          cat render-out/spectrum-video-metadata.json
          cat render-out/original-colour-video-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('spectrum-video-metadata.json', 'original-colour-video-metadata.json'):
              data=json.loads((Path('render-out')/name).read_text())
              stream=data['streams'][0]
              duration=float(data['format']['duration'])
              assert stream['width']==960 and stream['height']==720, data
              assert stream['avg_frame_rate']=='25/1', data
              assert int(stream['nb_read_frames'])==4113, data
              assert abs(duration-164.52)<0.01, data
          PY
          rm render-out/original-298-320x200.rgb
      - name: Upload rendered demo
        uses: actions/upload-artifact@v4
        with:
          name: another-world-zx-spectrum-rt45-render
          path: render-out/
          retention-days: 90
